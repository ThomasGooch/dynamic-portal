# The satellite registry.
#
# Config-as-code on purpose: the set of solutions changes on a deploy cadence,
# not a request cadence, so a reviewable, diffable, revertible file beats a table.
#
# Hostnames are parameterised so one reviewed file serves every environment:
# the default is the laptop, and compose overrides it with service names.
#
# `audience` defaults to [internal]. Leaving it off is how a satellite stays
# invisible to external clients — never add `external` to make something work.

- id: orders
  displayName: Order Management
  description: Track, review and approve customer orders.
  baseUrl: ${PORTAL_ORDERS_URL:-http://localhost:4001}
  # This satellite hosts its own MCP server, and it is the only one that does.
  # The bar for that is not "MCP is good" — the shim already makes every
  # satellite agent-reachable for free. The bar is a capability PUP cannot
  # express: `orders.search` takes a nested query, and `orders.reconcile` has no
  # screen at all. Two of three satellites omit this line, which is the ratio
  # the design expects.
  mcpUrl: ${PORTAL_ORDERS_MCP_URL:-http://localhost:4001/mcp}
  owner: fulfillment-team
  nav:
    section: Operations
    order: 10
  rbacScopes: [orders.read]
  # No satellite-level `roles`. Every org role may reach every satellite; what a
  # role may *do* is declared per screen and per action. The platform can still
  # narrow an individual tool below (see orders.approve) — it just cannot hide
  # the whole solution from a role that has business being in it.
  timeoutMs: 3000
  # Brokered to external clients under names the platform team assigns. The
  # mapping is the whole point: a satellite team renaming `orders.list` changes
  # this line, not every partner's integration.
  #
  # Declaring a name here is only half of it — the satellite's own manifest has
  # to mark the screen external too. `orders.approve` is deliberately absent:
  # the façade supports operations, and nothing is exposed as one yet.
  audience: [internal, external]
  public:
    service: order-management
    resources:
      - name: orders
        screenId: orders.list
      - name: order
        screenId: orders.detail
  # Tool policy is the governance file, and it governs *writes*. Screens are
  # agent-readable without an entry here — they are already bounded by audience
  # and scopes, and requiring one per screen would mean adding a screen needed a
  # hub deploy after all. A write is invisible until it is named here, on
  # purpose: exposing a mutation to a model is a decision a human makes.
  #
  # `orders.refresh` is deliberately absent. It is a write, so it stays
  # agent-invisible, and nothing about that is an oversight.
  tools:
    orders.approve:
      agentVisible: true
      requiresConfirmation: true
      rbacScopes: [orders.write]
      # Platform narrowing, the one deliberate showcase: the satellite's manifest
      # offers approve to [leadership, finance], but through the governed path
      # (agent / MCP / public) only finance may. The effective set is the
      # intersection, so this restricts without the satellite widening it back.
      roles: [finance]
    # Creating and changing an order are agent-reachable and both pause for a
    # person. The satellite validates every field regardless — this governs
    # whether a model may *propose* the write, not whether the rules apply.
    orders.create:
      agentVisible: true
      requiresConfirmation: true
      rbacScopes: [orders.write]
      # Matches the satellite's own declaration. Both are needed: this governs
      # whether a model may propose the write, the manifest governs whether a
      # person may click the button, and a mismatch would let the agent offer
      # something the form then refuses.
      roles: [engineering]
    orders.update:
      agentVisible: true
      requiresConfirmation: true
      rbacScopes: [orders.write]
      roles: [engineering]
    # Deletion is not offered to a model at all. Confirmation is a person
    # reading a card; invisibility is the model never raising it. For an
    # irreversible write the second is the one worth having, and it is a
    # decision that belongs in this file rather than in a satellite.
    orders.delete:
      agentVisible: false
      rbacScopes: [orders.write]
      roles: [leadership]
    # Never reaches an agent regardless of this entry — the gateway skips an
    # action that requires a file, because no model can produce bytes. Named
    # here so the write scope is stated where every other write's is.
    orders.attach:
      agentVisible: false
      rbacScopes: [orders.write]
      roles: [engineering]
    # The MCP tools are governed from the same file as the shimmed ones, and by
    # the same rules. A satellite that hosts its own server chooses what it can
    # *offer*; this file still decides what a model may reach and on what terms.
    #
    # `orders.search` is a read, so it is agent-visible without an entry — this
    # one exists only to name the scope. `orders.reconcile` is a bulk write and
    # is invisible until named here, exactly like `orders.approve`.
    orders.search:
      rbacScopes: [orders.read]
    orders.reconcile:
      agentVisible: true
      requiresConfirmation: true
      rbacScopes: [orders.write]

# No mcpUrl: this satellite ships no MCP server, so the hub generates a shim
# from its PUP manifest. It is the case that keeps the shim exercised.
- id: fleet
  displayName: Fleet Operations
  description: Vehicle status, utilisation and maintenance.
  baseUrl: ${PORTAL_FLEET_URL:-http://localhost:4002}
  owner: logistics-team
  nav:
    section: Operations
    order: 20
  rbacScopes: [fleet.read]
  timeoutMs: 3000

# The C# satellite. Node, Python and C# now, which is the polyglot claim with
# three data points rather than two.
#
# No mcpUrl and no `public` block: it ships no MCP server, so the hub generates
# a shim from this declaration, and nothing here is brokered outward yet.
- id: depots
  displayName: Depot Operations
  description: Capacity, utilisation and status by depot.
  baseUrl: ${PORTAL_DEPOTS_URL:-http://localhost:4003}
  owner: logistics-team
  nav:
    section: Operations
    order: 30
  rbacScopes: [depots.read]
  timeoutMs: 3000
  audience: [internal]
  tools:
    # Closing a depot is a mutation, so the shim defaults it to agent-invisible
    # and it stays that way: `agentVisible: true` is deliberately absent, and
    # adding it is the one-line decision a human makes to let a model propose
    # this. The entry exists so the confirmation requirement and the write scope
    # are already stated when someone does. The satellite checks the write scope
    # regardless — none of this is what keeps the data safe.
    depots.close:
      requiresConfirmation: true
      rbacScopes: [depots.write]
      roles: [platform]


name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run on the same branch is wasted compute; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node so its pnpm cache can resolve the store path.
      # No version pin here: the action reads `packageManager` from package.json,
      # which keeps CI and local on the same pnpm by construction.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `build` for this workspace is tsc in project-reference mode. It is a real
      # gate: the strict settings (exactOptionalPropertyTypes,
      # noUncheckedIndexedAccess) catch things the tests do not.
      - name: Build
        run: pnpm typecheck

      # The hub is noEmit and non-composite, so it cannot be a project
      # reference and the step above never visits it.
      - name: Build — hub (typecheck)
        run: pnpm --filter @portal/hub typecheck

      # And a real build, because `tsc` cannot see the class of failure that
      # actually bit during development: server/client boundary violations, a
      # bad next.config, or a page that fails to prerender. A typecheck-only
      # gate is the same hole one line up claims to close.
      - name: Build — hub (next build)
        env:
          PORTAL_PRINCIPAL_SECRET: ci-build-placeholder
        run: pnpm --filter @portal/hub build

      - name: Test — unit
        run: pnpm test:unit

      - name: Test — integration
        run: pnpm test:integration

      # The Python SDK's `ui.py` is generated from the catalog, and `--check`
      # compares without writing. Without this step the "it cannot drift"
      # guarantee is asserted by a comment and enforced only by whoever
      # remembers to run scripts/verify-ci.sh locally.
      - name: SDK — check for drift from the catalog
        run: pnpm sdk:check

  python:
    name: build + test (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/satellite-fleet

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Node lives in this job too, because the envelope validation below is a
      # Node script that drives a Python probe: it needs the uv environment to
      # build the envelopes and the Zod schemas to judge them, and this is the
      # only job with the former. Must precede setup-node so its pnpm cache can
      # resolve the store path.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen fails rather than silently re-resolving, so CI cannot drift
      # from the committed uv.lock — the same guarantee --frozen-lockfile gives
      # on the pnpm side.
      - name: Install
        run: uv sync --frozen

      # From the repository root: this job's default working directory is the
      # satellite, which is not a pnpm workspace package.
      - name: Install — node
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Test — unit
        run: uv run pytest -m "not integration"

      - name: Test — integration
        run: uv run pytest -m integration

      # Run from the satellite because that is where the environment with the
      # SDK installed lives — which also proves the editable path dependency
      # resolves.
      - name: Test — sdk
        run: uv run pytest ../../packages/sdk-python/tests -q

      - name: Validate every Python envelope against the hub's schemas
        working-directory: .
        run: pnpm sdk:python:validate

# The e2e tier is deliberately not run here: it needs the Docker stack up, and
# this workflow is scoped to build + test. Adding it later is `pnpm up` followed
# by `pnpm test:e2e`, with a `pnpm down` in an always() step. It is also the
# only tier that checks the Python satellite against the TypeScript schemas,
# so that cross-language guarantee is currently local-only.

  # The C# SDK. A separate job because it needs a .NET toolchain the other one
  # has no use for, and because its most valuable step is the last rather than
  # the tests: `validate` builds one of every envelope in C# and parses it with
  # the hub's own schemas. A .NET test can only confirm the SDK produced what
  # the SDK intended — nothing inside a test project can ask the protocol
  # whether that is a response the hub accepts, and the Python SDK shipped an
  # envelope the hub rejected outright for exactly that reason.
  csharp:
    name: build + test (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the generated SDK is not stale
        run: pnpm --filter @portal/sdk-csharp check

      - name: Test
        run: dotnet test -v q --nologo
        working-directory: packages/sdk-csharp

      - name: Validate every envelope against the hub's schemas
        run: pnpm sdk:csharp:validate

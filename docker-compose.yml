# Local stack. `pnpm up` builds and starts everything; `pnpm stack:test` runs
# the suite inside the same image the services run in.
#
# Services are added as they are built. Each new Node satellite is four lines:
# a build arg pointing at its workspace path, a port, an env block, a healthcheck.

name: dynamic-portal

x-node-build: &node-build
  context: .
  dockerfile: docker/node-app.Dockerfile

x-satellite-env: &satellite-env
  NODE_ENV: development
  # Dev-only shared secret. Production replaces this with per-satellite
  # verification of an RFC 8693 exchanged token against the issuer's JWKS.
  PORTAL_PRINCIPAL_SECRET: ${PORTAL_PRINCIPAL_SECRET:-dev-only-not-a-real-secret}

services:
  satellite-orders:
    build:
      <<: *node-build
      args:
        APP_PATH: apps/satellite-orders
    environment:
      <<: *satellite-env
      PORT: "4001"
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Python, and deliberately no MCP server — the case that proves the hub's
  # PUP-to-MCP shim has something to do. Its manifest is validated against the
  # TypeScript protocol schemas by the e2e tier, which is where the polyglot
  # claim stops being a claim.
  satellite-fleet:
    build:
      context: .
      dockerfile: docker/python-app.Dockerfile
      args:
        APP_PATH: apps/satellite-fleet
    environment:
      <<: *satellite-env
      PORT: "4002"
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # The hub. Waits for both satellites to be healthy — not because it cannot
  # start without them (an unwell satellite degrades to a scoped card, and there
  # is an e2e test for exactly that), but so `pnpm up` reaches a state where the
  # whole stack is demonstrably working rather than half of it.
  hub:
    build:
      context: .
      dockerfile: docker/hub.Dockerfile
    environment:
      <<: *satellite-env
      NODE_ENV: production
      # The dev session stub refuses to run under NODE_ENV=production unless
      # this is set. Explicit here so the compose stack is obviously not a
      # production deployment.
      PORTAL_ALLOW_DEV_SESSION: "1"
      # Mandatory. The hub refuses to serve without both: a default key would
      # produce a log that looks keyed and is not, and a default path one that
      # nobody knows to collect.
      # Passed through from the root `.env`, which compose loads and git
      # ignores. Absent means the assistant is off, which is a supported way to
      # run this portal rather than a broken one — every deterministic screen
      # behaves identically either way.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORTAL_AUDIT_KEY: ${PORTAL_AUDIT_KEY:-dev-only-not-a-real-audit-key}
      PORTAL_AUDIT_LOG: /tmp/portal-audit.jsonl
      PORT: "3000"
      # Inside the network the satellites answer to their service names, not to
      # localhost. The registry file defaults to localhost for a laptop and is
      # overridden here — one reviewed file, two environments.
      PORTAL_ORDERS_URL: http://satellite-orders:4001
      PORTAL_FLEET_URL: http://satellite-fleet:4002
    ports:
      - "3000:3000"
    depends_on:
      satellite-orders:
        condition: service_healthy
      satellite-fleet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Runs the workspace suite in the same image the services run in, so a green
  # local run and a green containerised run mean the same thing.
  test:
    build:
      <<: *node-build
      args:
        APP_PATH: apps/satellite-orders
    environment:
      <<: *satellite-env
    depends_on:
      satellite-orders:
        condition: service_healthy
    # Both in-process tiers, not just unit: running only `test:unit` in the image
    # would exercise exactly the tier that needs no container, and would leave
    # the integration tier — the one that proves a satellite scopes its own
    # tenants — untested in the environment the services actually run in.
    command: ["sh", "-c", "pnpm run test:unit && pnpm run test:integration"]
    profiles: ["test"]

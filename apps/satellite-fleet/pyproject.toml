[project]
name = "satellite-fleet"
version = "0.1.0"
description = "Demo satellite — fleet. Serves PUP screens over FastAPI and authorizes its own tenants."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satellite_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirrors the JS side's tier split: `-m "not integration"` is the unit tier,
# `-m integration` is the tier that binds a real port.
markers = [
    "integration: exercises a real uvicorn server on a real socket",
]
# The tier split is only as good as the marker names. Without this a typo like
# `@pytest.mark.integraton` is silently ignored, so the test lands in the unit
# tier and the integration tier stops covering it.
addopts = ["--strict-markers"]
